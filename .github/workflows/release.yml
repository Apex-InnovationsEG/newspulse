name: Publish installer release
on:
  push:
    branches: [release-files]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release with installer and latest.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="$(tr -d '[:space:]' < VERSION)"
          TAG="v${VER}"
          cp NewsPulse-Setup.exe "NewsPulse-Setup-${VER}.exe"
          SHA=$(sha256sum NewsPulse-Setup.exe | cut -d' ' -f1 | tr a-f A-F)
          {
            echo "Windows 10/11 installer (64-bit)."
            echo
            echo "SHA-256: ${SHA}"
            echo
            echo "Not code-signed yet: if SmartScreen appears, click More info, then Run anyway."
          } > notes.md
          gh release create "$TAG" NewsPulse-Setup.exe "NewsPulse-Setup-${VER}.exe" latest.json \
            --title "NewsPulse ${VER}" --notes-file notes.md --latest
